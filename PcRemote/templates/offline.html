<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PcRemote - Offline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1115;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 40px 25px;
            text-align: center;
            background: #181b21;
            border-radius: 20px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 10px;
        }

        p {
            color: #aeb4bf;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icon">🔴</div>
        <h1>PC OFFLINE</h1>
        <p>No se puede conectar con el ordenador.</p>
    </div>

</body>
</html>
